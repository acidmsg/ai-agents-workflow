# =============================================================================
# bootstrap-phase0.conf — конфигурация для bootstrap-phase0.sh
# Редактируй под конкретный сервер. Если файла нет — используются значения ниже.
# =============================================================================

# --- Пользователи и группы ---

# Группа для общего доступа
readonly GROUP_NAME="ai-workers"

# Пользователи: "username:Описание"
USERS=(
    "n8n_user:Оркестратор n8n"
    "openclaw:Кодер OpenClaw"
    "antigravity_user:Критик Antigravity"
    "hermes:Утилита Hermes"
)

# --- Git ---

# Email-домен для git-конфигов
readonly GIT_EMAIL_DOMAIN="ai-agent.acidbox"

# Имена для git user.name (ключ — username)
declare -A GIT_NAMES=(
    ["n8n_user"]="n8n Orchestrator"
    ["openclaw"]="OpenClaw Agent"
    ["antigravity_user"]="Antigravity Critic"
    ["hermes"]="Hermes Agent"
)

# --- Пути ---

# Общая директория проектов
readonly PROJECTS_DIR="/srv/projects"

# Секреты (переменные окружения)
readonly SECRETS_DIR="/opt/secrets"

# Конфигурационные файлы
readonly CONFIG_DIR="/opt/config"

# Общие скрипты
readonly SCRIPTS_DIR="/opt/scripts"

# --- n8n ---

# Порт n8n
readonly N8N_PORT=5678

# Webhook URL (замени на реальный домен/IP после разворачивания)
readonly N8N_WEBHOOK_URL="https://your-vps-domain-or-ip:5678/"

# --- Линтеры ---

# Версия golangci-lint
readonly GOLANGCI_LINT_VERSION="v1.59.1"

# --- Проверки ---

# Минимальное свободное место на диске (MB)
readonly MIN_DISK_SPACE_MB=500
