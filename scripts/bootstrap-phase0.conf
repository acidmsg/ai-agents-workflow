# =============================================================================
# bootstrap-phase0.conf — переопределение значений по умолчанию
# Все поля опциональны. Незаданные значения берутся из скрипта.
# Раскомментируй строку и замени значение чтобы переопределить.
# =============================================================================

# --- Пользователи и группа ---

# Группа для общего доступа к проектам и секретам
# GROUP_NAME="ai-workers"

# --- Git ---

# Домен для email-адресов git-конфигов (user@ДОМЕН)
# GIT_EMAIL_DOMAIN="ai-agent.acidbox"

# --- Пути ---

# Общая директория проектов (SGID, доступна всей группе)
# PROJECTS_DIR="/srv/projects"

# --- n8n ---

# Порт для веб-интерфейса n8n
# N8N_PORT=5678

# --- Линтеры ---

# Версия golangci-lint
# GOLANGCI_LINT_VERSION="v1.59.1"

# Пропустить установку всех линтеров (если уже стоят или не нужны)
# SKIP_LINTERS="false"

# --- Права доступа ---

# Маска прав для новых файлов (0022 = стандарт, 0002 = группе можно писать)
# UMASK="0002"

# Права на домашние директории пользователей (0750 = только владелец, 2775 = +SGID +группа)
# HOME_DIR_PERMS="2775"

# --- Системные проверки ---

# Минимальное свободное место на диске (в мегабайтах)
# MIN_DISK_SPACE_MB=500
